name: Build Xray subscription

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "scripts/**"
      - ".github/workflows/update-subscription.yml"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: subscription-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate subscription
        run: python scripts/generate.py
      - name: Commit updated subscription
        run: |
          if git diff --quiet -- fast/sub/normal; then
            echo "Subscription unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast/sub/normal
          git commit -m "Update generated subscription"
          git push
